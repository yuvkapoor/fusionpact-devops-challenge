name: CI-CD Pipeline

on:
  push:
    branches: ["feat/solution", "main"]
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4️⃣ Build & push backend
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fusionpact-backend:latest

      # 5️⃣ Build & push frontend
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fusionpact-frontend:latest

      # 6️⃣ Prepare SSH private key file securely
      - name: Prepare SSH private key file
        shell: bash
        run: |
          echo "${{ secrets.VM_SSH_KEY }}" > ./vm_id_rsa
          chmod 600 ./vm_id_rsa
          echo "SSH key file prepared successfully."

      # 7️⃣ Deploy to Cloud VM via Appleboy SSH Action
      - name: Deploy to Cloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key_path: ./vm_id_rsa
          port: ${{ secrets.VM_SSH_PORT }} # Optional
          script: |
            set -e
            cd ~/fusionpact-devops-challenge || exit 1
            echo "Pulling latest code..."
            git fetch --all
            if git rev-parse --verify feat/solution >/dev/null 2>&1; then
              git checkout feat/solution
              git pull origin feat/solution
            else
              git checkout main
              git pull origin main
            fi
            echo "Updating Docker containers..."
            docker compose pull
            docker compose down
            docker compose up -d
            echo "✅ Deployment completed successfully!"
