name: Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH private key file
        run: |
          echo "${{ secrets.VM_SSH_KEY }}" > ./vm_id_rsa
          chmod 600 ./vm_id_rsa
          echo "✅ SSH key file created, size (bytes): $(wc -c < ./vm_id_rsa)"
        shell: bash

      - name: Add VM to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts
          echo "✅ Added ${{ secrets.VM_HOST }} to known hosts"

      - name: Test SSH connection
        run: |
          ssh -i ./vm_id_rsa -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "echo '✅ SSH connection successful!'"
        shell: bash

      - name: Deploy application
        run: |
          ssh -i ./vm_id_rsa -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
          cd /home/yuvk/fusionpact-devops-challenge
          git pull origin main
          docker compose pull
          docker compose down
          docker compose up -d
          echo "🚀 Deployment completed successfully!"
          EOF
        shell: bash
