name: Deploy to VM

on:
  push:
    branches:
      - main
      - feat/*
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------
      # 1️⃣ Checkout Repository
      # ------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------
      # 2️⃣ Prepare SSH Key
      #    - Fixes newline issue for secrets
      # ------------------------------
      - name: Prepare SSH private key file
        run: |
          echo "${{ secrets.VM_SSH_KEY }}" | tr -d '\r' | sed 's/\\n/\n/g' > ./vm_id_rsa
          chmod 600 ./vm_id_rsa
          echo "✅ SSH key restored and ready"
        shell: bash

      # ------------------------------
      # 3️⃣ Add VM to Known Hosts
      # ------------------------------
      - name: Add VM to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts
          echo "✅ Added ${{ secrets.VM_HOST }} to known hosts"
        shell: bash

      # ------------------------------
      # 4️⃣ Test SSH Connection
      # ------------------------------
      - name: Test SSH connection
        run: |
          ssh -i ./vm_id_rsa -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "echo '✅ SSH connection successful from GitHub Actions!'"
        shell: bash

      # ------------------------------
      # 5️⃣ Deploy Application
      # ------------------------------
      - name: Build and Push Docker images
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest ./frontend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/backend:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/backend:latest

      - name: Deploy application
        run: |
          ssh -i ./vm_id_rsa -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
          cd /home/yuvk/fusionpact-devops-challenge
          echo "🔄 Pulling latest code..."
          git pull origin main
          echo "🐋 Updating Docker containers..."
          docker-compose pull
          docker-compose down
          docker-compose up -d
          echo "🚀 Deployment completed successfully!"
          EOF
        shell: bash
