name: CI-CD Pipeline

on:
  push:
    branches: ["feat/solution", "main"]
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fusionpact-backend:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fusionpact-frontend:latest

      - name: Debug: Check SSH Private Key Length (lines)
        run: echo "${{ secrets.VM_SSH_KEY }}" | wc -l

      - name: Debug: Show first line of SSH Private Key
        run: echo "${{ secrets.VM_SSH_KEY }}" | head -1

      - name: Debug: Check if SSH key has passphrase (expect no output)
        run: ssh-keygen -y -f <(echo "${{ secrets.VM_SSH_KEY }}") || echo "Key possibly has passphrase or invalid"

      - name: Debug: Show SSH Client Version
        run: ssh -V

      - name: Deploy to cloud VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/fusionpact-devops-challenge
            git pull origin feat/solution
            docker-compose pull
            docker-compose down
            docker-compose up -d
